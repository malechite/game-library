info:
  name: List Users
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns paginated users", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data).to.be.an("array");
          expect(res.getBody().total).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
