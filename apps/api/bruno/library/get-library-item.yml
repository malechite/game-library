info:
  name: Get Library Item
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/library/{{libraryItemId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the joined item", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("libraryItemId"));
          expect(res.getBody().platformName).to.be.a("string");
          expect(res.getBody().genreNames).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
