info:
  name: Get Category
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/categories/{{categoryId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the category", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("categoryId"));
          expect(res.getBody().name).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
