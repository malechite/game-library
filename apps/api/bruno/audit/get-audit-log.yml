info:
  name: Get Audit Log
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/audit/{{auditId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the audit entry", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("auditId"));
          expect(res.getBody().service).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
