info:
  name: Logout
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/authentication"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("accessToken", "");
    - type: tests
      code: |-
        test("logout succeeds", function () {
          expect([200, 201]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
