info:
  name: Remove Ownership
  type: http
  seq: 5

# Super admin only. Fails (foreign key) while any game or collection item still references the row.
http:
  method: DELETE
  url: "{{baseUrl}}/ownerships/{{newOwnershipId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the removed ownership", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("newOwnershipId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
