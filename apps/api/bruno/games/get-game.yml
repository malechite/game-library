info:
  name: Get Game
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/games/{{gameId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the game", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("gameId"));
          expect(res.getBody().genreIds).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
