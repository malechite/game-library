info:
  name: Remove Game
  type: http
  seq: 5

# Super admin only. Fails (foreign key) while any collection item references the game —
# run collection-items/remove-collection-item first.
http:
  method: DELETE
  url: "{{baseUrl}}/games/{{gameId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the removed game", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("gameId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
