services:
  postgres:
    image: postgres:16
    container_name: game_library_postgres
    environment:
      POSTGRES_USER: game_library
      POSTGRES_PASSWORD: development
      POSTGRES_DB: game_library_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - game_library_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - game-library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_library -d game_library_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: game_library_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: game_library
      MINIO_ROOT_PASSWORD: development
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - game_library_minio_data:/data
    networks:
      - game-library-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  game_library_data:
  game_library_minio_data:

networks:
  game-library-network:
    driver: bridge
