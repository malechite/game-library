---
# Game Library Deployment (Feathers API + the built web SPA, one container)
#
# Uses ExternalSecrets (from 1Password) for sensitive values.
# Required 1Password Items (K8s - Everhart vault):
#   Name: game-library
#   Fields:
#     - FEATHERS_SECRET
#     - S3_ACCESS_KEY_ID
#     - S3_SECRET_ACCESS_KEY
#     - IGDB_CLIENT_ID
#     - IGDB_CLIENT_SECRET
#
#   Name: game-library-db
#   Fields:
#     - POSTGRES_PASSWORD
#     - GAME_LIBRARY_DB_URL

apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-library
  namespace: everhart
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-library
  template:
    metadata:
      labels:
        app: game-library
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/malechite/game-library:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3030
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3030"
            # CORS allow-list (JSON array) — see game-library-config.
            - name: ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: game-library-config
                  key: ORIGINS
            # Secrets from ExternalSecret game-library-app-secret
            - name: FEATHERS_SECRET
              valueFrom:
                secretKeyRef:
                  name: game-library-app-secret
                  key: FEATHERS_SECRET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: game-library-app-secret
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: game-library-app-secret
                  key: S3_SECRET_ACCESS_KEY
            # Secrets from ExternalSecret game-library-db-secret
            - name: GAME_LIBRARY_DB_URL
              valueFrom:
                secretKeyRef:
                  name: game-library-db-secret
                  key: GAME_LIBRARY_DB_URL
            # S3 config from ConfigMap
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: game-library-config
                  key: S3_ENDPOINT
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: game-library-config
                  key: S3_PUBLIC_ENDPOINT
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: game-library-config
                  key: S3_REGION
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: game-library-config
                  key: S3_BUCKET
            # Allow self-signed MinIO cert
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            # IGDB (Twitch application) credentials for the "Add game" search and
            # modern-platform covers, from ExternalSecret game-library-app-secret.
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: game-library-app-secret
                  key: IGDB_CLIENT_ID
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: game-library-app-secret
                  key: IGDB_CLIENT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Run DB migrations + seed, then start the server. Reuses this
          # container's env (GAME_LIBRARY_DB_URL, FEATHERS_SECRET, …). Migrations use
          # knex's lock and the seed is idempotent + race-tolerant, so it's safe
          # across the 2 replicas. `public` resolves to ../web/dist inside the image. NODE_ENV=production → knexfile reads the
          # compiled lib/db/migrations.
          command: ["sh", "-c"]
          args: ["./node_modules/.bin/knex migrate:latest && node lib/db/seed.js && node lib"]
