---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: game-library-db-pv
  namespace: everhart
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/db/game-library
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: game-library-db-pvc
  namespace: everhart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: game-library-db-pv
