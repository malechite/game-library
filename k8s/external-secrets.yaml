---
# Game Library ExternalSecrets
# Syncs DB credentials and app secrets from 1Password to Kubernetes

---
# Postgres DB credentials
# Used by the game-library-db deployment (POSTGRES_PASSWORD)
# and by the API for the connection string
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-library-db-secret
  namespace: everhart
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-everhart
  target:
    name: game-library-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "game-library-db/POSTGRES_PASSWORD"
    - secretKey: GAME_LIBRARY_DB_URL
      remoteRef:
        key: "game-library-db/GAME_LIBRARY_DB_URL"

---
# Game Library app secrets
# Used by the 1Password Secrets Injector in the API pod
# This secret is NOT mounted; the injector reads it directly
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-library-app-secret
  namespace: everhart
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-everhart
  target:
    name: game-library-app-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FEATHERS_SECRET
      remoteRef:
        key: "game-library/FEATHERS_SECRET"
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: "game-library/S3_ACCESS_KEY_ID"
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: "game-library/S3_SECRET_ACCESS_KEY"
    # IGDB (Twitch application) credentials: "Add game" search + cover art for
    # platforms the libretro thumbnails don't cover.
    - secretKey: IGDB_CLIENT_ID
      remoteRef:
        key: "game-library/IGDB_CLIENT_ID"
    - secretKey: IGDB_CLIENT_SECRET
      remoteRef:
        key: "game-library/IGDB_CLIENT_SECRET"
